<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071a2f">
    <meta name="description" content="تصميم وتطوير مواقع شركات احترافية ثنائية اللغة للشركات الصغيرة والمتوسطة في السعودية.">
    <meta name="keywords" content="تصميم مواقع شركات، تطوير مواقع السعودية، مواقع ثنائية اللغة، Bilingual website design Saudi Arabia">
    <meta property="og:title" content="Roaa Agency | رؤى إيجنسي">
    <meta property="og:description" content="مواقع شركات ثنائية اللغة تبني الثقة وتسهّل التواصل.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://roaa.agency">
    <link rel="canonical" href="https://roaa.agency">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <title>Roaa Agency | رؤى إيجنسي</title>
    <style>
@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap");

:root {
  --font-arabic: "IBM Plex Sans Arabic";
  --font-latin: "Manrope";
  --ink: #071a2f;
  --ink-soft: #26384b;
  --emerald: #08745f;
  --emerald-dark: #045a49;
  --sand: #c89e63;
  --cool: #f2f6f7;
  --line: #d6dfe2;
  --white: #ffffff;
  --shadow: 0 28px 70px rgba(7, 26, 47, 0.12);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--white);
  color: var(--ink);
  font-family: var(--font-arabic), Tahoma, Arial, sans-serif;
  text-rendering: optimizeLegibility;
}

html[lang="en"] body {
  font-family: var(--font-latin), Arial, sans-serif;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
select,
textarea {
  font: inherit;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

:focus-visible {
  outline: 3px solid rgba(8, 116, 95, 0.38);
  outline-offset: 4px;
}

.site-shell {
  min-height: 100vh;
  overflow: hidden;
  background: var(--white);
}

.site-header {
  position: fixed;
  inset: 0 0 auto;
  z-index: 50;
  height: 92px;
  border-bottom: 1px solid rgba(7, 26, 47, 0.12);
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(18px);
}

.header-inner {
  width: min(1500px, calc(100% - 64px));
  height: 100%;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(180px, 1fr) auto minmax(220px, 1fr);
  align-items: center;
  gap: 32px;
}

.brand {
  display: inline-flex;
  align-items: center;
  justify-self: start;
  gap: 12px;
  direction: ltr;
  color: var(--ink);
}

[dir="rtl"] .brand {
  justify-self: end;
}

.brand-main {
  font-family: var(--font-latin), Arial, sans-serif;
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 0.06em;
}

.brand-divider {
  width: 1px;
  height: 34px;
  background: var(--sand);
  transform: rotate(17deg);
}

.brand-ar {
  font-size: 31px;
  font-weight: 700;
}

.main-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(24px, 3vw, 52px);
  font-size: 16px;
  font-weight: 600;
}

.main-nav a {
  position: relative;
  padding: 34px 0 30px;
  white-space: nowrap;
}

.main-nav a::after {
  content: "";
  position: absolute;
  inset: auto 0 20px;
  height: 2px;
  background: var(--emerald);
  transform: scaleX(0);
  transition: transform 180ms ease;
}

.main-nav a:hover::after,
.main-nav a:focus-visible::after {
  transform: scaleX(1);
}

.main-nav a:first-child::after {
  transform: scaleX(1);
}

.header-actions {
  display: flex;
  align-items: center;
  justify-self: end;
  gap: 12px;
  direction: ltr;
}

[dir="rtl"] .header-actions {
  justify-self: start;
}

.language-toggle,
.menu-toggle {
  border: 0;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
}

.language-toggle {
  min-width: 48px;
  padding: 12px 10px;
  font-family: var(--font-latin), var(--font-arabic), sans-serif;
  font-size: 14px;
  font-weight: 700;
}

.header-quote,
.mobile-quote {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 50px;
  padding: 0 24px;
  background: var(--emerald);
  color: var(--white);
  font-size: 15px;
  font-weight: 700;
  transition: background 180ms ease, transform 180ms ease;
}

.header-quote:hover {
  background: var(--emerald-dark);
  transform: translateY(-2px);
}

.menu-toggle,
.mobile-quote {
  display: none;
}

.menu-toggle svg {
  width: 28px;
  height: 28px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
}

.hero {
  position: relative;
  padding: 164px max(32px, calc((100vw - 1500px) / 2)) 0;
}

.hero-grid {
  min-height: calc(100vh - 210px);
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(500px, 0.92fr);
  align-items: start;
  gap: clamp(42px, 4.5vw, 72px);
  padding-top: 72px;
}

[dir="ltr"] .hero-grid {
  grid-template-columns: minmax(500px, 0.92fr) minmax(0, 1.08fr);
}

[dir="ltr"] .hero-copy {
  grid-column: 1;
}

[dir="ltr"] .hero-visual {
  grid-column: 2;
}

.hero-copy {
  position: relative;
  z-index: 2;
  max-width: 720px;
}

.hero-copy h1 {
  margin: 0;
  font-size: clamp(50px, 4.6vw, 80px);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.045em;
}

html[lang="en"] .hero-copy h1 {
  font-family: var(--font-latin), Arial, sans-serif;
  font-size: clamp(48px, 4.8vw, 78px);
  line-height: 1.05;
  letter-spacing: -0.055em;
}

.hero-copy p {
  max-width: 650px;
  margin: 30px 0 0;
  color: var(--ink-soft);
  font-size: clamp(19px, 1.55vw, 25px);
  font-weight: 400;
  line-height: 1.85;
}

html[lang="en"] .hero-copy p {
  line-height: 1.65;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 38px;
}

.button {
  min-height: 64px;
  min-width: 184px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 0 28px;
  border: 1px solid var(--emerald);
  font-size: 17px;
  font-weight: 700;
  transition: background 180ms ease, color 180ms ease, transform 180ms ease;
}

.button svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

[dir="rtl"] .button svg {
  transform: scaleX(-1);
}

.button-primary {
  background: var(--emerald);
  color: var(--white);
}

.button-primary:hover {
  background: var(--emerald-dark);
  transform: translateY(-3px);
}

.button-secondary {
  background: var(--white);
  color: var(--emerald);
}

.button-secondary:hover {
  background: var(--cool);
  transform: translateY(-3px);
}

.hero-visual {
  position: relative;
  min-width: 0;
  aspect-ratio: 1.35;
  display: flex;
  align-items: center;
  justify-content: center;
  direction: ltr;
}

.hero-visual img {
  position: relative;
  z-index: 2;
  width: 116%;
  max-width: none;
  height: auto;
  mix-blend-mode: multiply;
  filter: drop-shadow(0 28px 36px rgba(7, 26, 47, 0.08));
}

.line-frame {
  position: absolute;
  z-index: 1;
  border: 1px solid rgba(200, 158, 99, 0.8);
  border-radius: 28px;
}

.frame-one {
  inset: 10% 14% 14% 4%;
}

.frame-two {
  inset: 16% 3% 6% 18%;
}

.dot-matrix {
  position: absolute;
  z-index: 3;
  inset: 14% auto auto 0;
  width: 76px;
  height: 76px;
  background-image: radial-gradient(circle, var(--sand) 2px, transparent 2.5px);
  background-size: 15px 15px;
  opacity: 0.8;
}

.trust-line {
  min-height: 76px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  border-top: 1px solid var(--line);
  color: var(--ink-soft);
  font-size: 15px;
  font-weight: 600;
}

.trust-line span {
  padding: 0 clamp(18px, 3vw, 48px);
}

.trust-line span + span {
  border-inline-start: 1px solid var(--sand);
}

.section-intro {
  min-height: 520px;
  padding: 120px max(32px, calc((100vw - 1500px) / 2));
  background: var(--cool);
}

.section-code {
  margin: 0 0 22px;
  color: var(--sand);
  font-family: var(--font-latin), Arial, sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.18em;
}

.section-intro h2 {
  max-width: 900px;
  margin: 0;
  font-size: clamp(44px, 5vw, 78px);
  line-height: 1.2;
  letter-spacing: -0.04em;
}

.section-intro > p:last-child {
  max-width: 640px;
  margin: 28px 0 0;
  color: var(--ink-soft);
  font-size: 21px;
  line-height: 1.8;
}

.services-section,
.work-section,
.process-section,
.packages-section {
  padding: 132px max(32px, calc((100vw - 1500px) / 2));
}

.services-section {
  background: var(--cool);
}

.section-heading {
  margin-bottom: 64px;
}

.section-heading h2 {
  max-width: 1020px;
  margin: 0;
  font-size: clamp(50px, 5.2vw, 82px);
  font-weight: 700;
  line-height: 1.16;
  letter-spacing: -0.045em;
}

html[lang="en"] .section-heading h2 {
  font-family: var(--font-latin), Arial, sans-serif;
  line-height: 1.05;
}

.section-lead {
  max-width: 680px;
  margin: 24px 0 0;
  color: var(--ink-soft);
  font-size: 20px;
  line-height: 1.75;
}

.split-heading {
  display: grid;
  grid-template-columns: minmax(560px, 1.15fr) minmax(420px, 0.85fr);
  align-items: end;
  gap: 80px;
}

[dir="rtl"] .split-heading > div {
  grid-column: 2;
  grid-row: 1;
}

[dir="rtl"] .split-heading > h2 {
  grid-column: 1;
  grid-row: 1;
}

.split-heading .section-lead {
  font-size: 22px;
}

.centered {
  text-align: center;
}

.centered h2,
.centered .section-lead {
  margin-inline: auto;
}

.service-list {
  border-top: 1px solid rgba(7, 26, 47, 0.22);
}

.service-row {
  min-height: 172px;
  display: grid;
  grid-template-columns: minmax(220px, 0.8fr) minmax(500px, 1.7fr) 110px;
  align-items: center;
  gap: 42px;
  border-bottom: 1px solid rgba(7, 26, 47, 0.18);
  transition: background 180ms ease, padding 180ms ease;
}

.service-row:hover {
  padding-inline: 22px;
  background: rgba(255, 255, 255, 0.72);
}

[dir="rtl"] .service-number {
  order: -3;
}

[dir="rtl"] .service-copy {
  order: -2;
}

[dir="rtl"] .service-en {
  order: -1;
}

[dir="rtl"] .service-en {
  direction: ltr;
  text-align: left;
}

.service-en {
  font-family: var(--font-latin), Arial, sans-serif;
  color: var(--ink-soft);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.14em;
}

.service-copy h3 {
  margin: 0;
  font-size: clamp(27px, 2.3vw, 40px);
  line-height: 1.25;
}

.service-copy p {
  margin: 10px 0 0;
  color: var(--ink-soft);
  font-size: 18px;
  line-height: 1.65;
}

.service-number {
  position: relative;
  padding-inline-start: 32px;
  border-inline-start: 1px solid var(--sand);
  color: var(--ink);
  font-family: var(--font-latin), Arial, sans-serif;
  font-size: 76px;
  font-weight: 400;
  line-height: 1;
}

.service-row:first-child .service-number {
  color: var(--emerald);
}

.work-section {
  background: var(--white);
}

.work-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--ink);
}

.work-item {
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(190px, 0.68fr) minmax(300px, 1.32fr);
  gap: 28px;
  padding: 44px 32px 52px;
}

.work-item:nth-child(odd) {
  padding-inline-start: 0;
  border-inline-end: 1px solid rgba(7, 26, 47, 0.38);
}

.work-item:nth-child(even) {
  padding-inline-end: 0;
}

.work-item:nth-child(n + 3) {
  border-top: 1px solid rgba(7, 26, 47, 0.38);
}

.work-number {
  display: block;
  margin-bottom: 28px;
  font-family: var(--font-latin), Arial, sans-serif;
  font-size: 56px;
  line-height: 1;
}

.work-copy h3 {
  margin: 0;
  font-family: var(--font-latin), var(--font-arabic), sans-serif;
  font-size: clamp(21px, 1.75vw, 29px);
  line-height: 1.3;
}

.work-category {
  margin: 16px 0 0 !important;
  color: var(--emerald) !important;
  font-weight: 700;
}

.work-copy p {
  margin: 18px 0 0;
  color: var(--ink-soft);
  font-size: 16px;
  line-height: 1.7;
}

.project-preview {
  min-height: 310px;
  align-self: center;
  overflow: hidden;
  border: 1px solid #b7c5cb;
  background: #fbfcfc;
  box-shadow: 0 22px 48px rgba(7, 26, 47, 0.08);
  direction: ltr;
}

.preview-toolbar {
  height: 34px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  border-bottom: 1px solid #d6dfe2;
  background: white;
}

.preview-toolbar i {
  width: 6px;
  height: 6px;
  border: 1px solid #99a9af;
  border-radius: 50%;
}

.preview-toolbar span {
  width: 38%;
  height: 3px;
  margin-left: auto;
  background: #cad4d7;
}

.corporate-ui {
  position: relative;
  height: 276px;
  padding: 44px 28px 70px;
}

.ui-copy {
  width: 44%;
  display: grid;
  gap: 12px;
}

.ui-copy b,
.ui-copy span {
  height: 5px;
  background: #a9b7bc;
}

.ui-copy b {
  width: 80%;
  height: 9px;
  background: var(--ink);
}

.ui-copy span:nth-child(3) {
  width: 72%;
}

.ui-copy em {
  width: 62px;
  height: 13px;
  margin-top: 8px;
  background: var(--emerald);
}

.ui-building {
  position: absolute;
  inset: 34px 26px auto auto;
  width: 35%;
  height: 120px;
  border: 1px solid #b5c2c6;
  clip-path: polygon(50% 0, 100% 25%, 100% 100%, 0 100%, 0 28%);
  background: repeating-linear-gradient(90deg, transparent 0 18px, #d5dddf 18px 19px), repeating-linear-gradient(0deg, transparent 0 18px, #d5dddf 18px 19px);
}

.ui-service-row {
  position: absolute;
  inset: auto 20px 20px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.ui-service-row i {
  height: 48px;
  border: 1px solid #cad4d7;
  background: white;
}

.fleet-ui,
.portal-ui,
.email-ui {
  position: relative;
  height: 276px;
  padding: 22px 22px 22px 64px;
}

.ui-sidebar {
  position: absolute;
  inset: 0 auto 0 0;
  width: 44px;
  display: grid;
  align-content: start;
  gap: 18px;
  padding-top: 24px;
  background: var(--ink);
}

.ui-sidebar i {
  width: 10px;
  height: 10px;
  margin: auto;
  border: 1px solid white;
}

.ui-map {
  position: relative;
  height: 150px;
  border: 1px solid #d5dfe2;
  background: linear-gradient(32deg, transparent 45%, #d5dfe2 46% 47%, transparent 48%), linear-gradient(-27deg, transparent 54%, #d5dfe2 55% 56%, transparent 57%), #f6f9f9;
}

.ui-map b {
  position: absolute;
  width: 11px;
  height: 11px;
  border: 2px solid white;
  border-radius: 50%;
  background: var(--emerald);
  box-shadow: 0 2px 4px rgba(7, 26, 47, 0.2);
}

.ui-map b:nth-child(1) { inset: 28% auto auto 24%; }
.ui-map b:nth-child(2) { inset: 56% auto auto 42%; }
.ui-map b:nth-child(3) { inset: 33% auto auto 68%; }
.ui-map b:nth-child(4) { inset: 68% auto auto 77%; background: var(--sand); }

.ui-map span {
  position: absolute;
  right: 14px;
  width: 52px;
  height: 4px;
  background: #becace;
}

.ui-map span:nth-of-type(1) { top: 18px; }
.ui-map span:nth-of-type(2) { top: 31px; width: 38px; }

.ui-table {
  display: grid;
  gap: 10px;
  margin-top: 14px;
}

.ui-table i {
  height: 11px;
  border-bottom: 1px solid #d4dde0;
  background: linear-gradient(90deg, #c1cdd0 0 25%, transparent 25% 75%, var(--emerald) 75% 78%, transparent 78%);
}

.portal-ui {
  padding-left: 22px;
}

.ui-steps {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  margin-bottom: 22px;
  border-top: 1px solid #b8c5c9;
}

.ui-steps i {
  width: 16px;
  height: 16px;
  margin-top: -8px;
  border: 1px solid #aebdc1;
  border-radius: 50%;
  background: white;
}

.ui-steps i:first-child {
  background: var(--emerald);
  border-color: var(--emerald);
}

.ui-form {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.ui-form span {
  height: 43px;
  border: 1px solid #d4dde0;
  background: linear-gradient(#c2cdd0, #c2cdd0) 12px 12px / 42% 4px no-repeat;
}

.email-ui {
  display: grid;
  grid-template-columns: 1.45fr 0.8fr;
  gap: 14px;
  padding-left: 22px;
}

.ui-editor,
.ui-calendar {
  border: 1px solid #d4dde0;
  background: white;
}

.ui-editor {
  display: grid;
  align-content: start;
  gap: 10px;
  padding: 18px;
}

.ui-editor span {
  height: 5px;
  background: #c1cdd0;
}

.ui-editor div {
  height: 90px;
  margin-top: 8px;
  border: 1px solid #d4dde0;
  background: linear-gradient(135deg, transparent 55%, #d9e1e3 56%);
}

.ui-calendar {
  position: relative;
  background: repeating-linear-gradient(0deg, transparent 0 26px, #dbe2e4 26px 27px), repeating-linear-gradient(90deg, transparent 0 26px, #dbe2e4 26px 27px), white;
}

.ui-calendar i {
  position: absolute;
  width: 26px;
  height: 26px;
  background: var(--emerald);
}

.ui-calendar i:first-child { inset: 53px auto auto 53px; }
.ui-calendar i:last-child { inset: 105px auto auto 26px; opacity: 0.65; }

.ui-status {
  grid-column: 1 / -1;
  display: flex;
  gap: 14px;
}

.ui-status b {
  width: 48px;
  height: 5px;
  background: #bdc9cd;
}

.ui-status b:first-child {
  background: var(--emerald);
}

.text-link {
  width: fit-content;
  display: inline-flex;
  align-items: center;
  gap: 14px;
  margin-top: 42px;
  color: var(--emerald);
  font-size: 17px;
  font-weight: 700;
}

.text-link svg,
.package-link svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

[dir="rtl"] .text-link svg,
[dir="rtl"] .package-link svg {
  transform: scaleX(-1);
}

.process-section {
  background: var(--cool);
}

.process-rail {
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  margin: 106px 0 118px;
}

.process-rail::before {
  content: "";
  position: absolute;
  inset: 78px 0 auto;
  height: 2px;
  background: var(--ink);
}

.process-step {
  position: relative;
  padding: 0 24px;
}

.process-step:first-child {
  padding-inline-start: 0;
}

.process-step:last-child {
  padding-inline-end: 0;
}

.process-step > span {
  display: block;
  margin-bottom: 58px;
  color: var(--ink);
  font-family: var(--font-latin), Arial, sans-serif;
  font-size: 42px;
  font-weight: 700;
}

.process-step i {
  position: absolute;
  inset: 67px 24px auto auto;
  z-index: 2;
  width: 23px;
  height: 23px;

            <div class="hero-visual"><div class="line-frame frame-one" aria-hidden="true"></div><div class="line-frame frame-two" aria-hidden="true"></div><div class="dot-matrix" aria-hidden="true"></div><img src="assets/hero-devices.png" alt="${escapeHtml(copy.hero.visualAlt)}" width="1672" height="941" loading="eager" fetchpriority="high"></div>
          </div>
          <div class="trust-line">${trust}</div>
        </section>

        <section class="services-section" id="services"><div class="section-heading split-heading"><div><p class="section-code">${escapeHtml(copy.services.code)}</p><p class="section-lead">${escapeHtml(copy.services.lead)}</p></div><h2>${escapeHtml(copy.services.title)}</h2></div><div class="service-list">${services}</div></section>

        <section class="work-section" id="work"><div class="section-heading"><p class="section-code">${escapeHtml(copy.work.code)}</p><h2>${escapeHtml(copy.work.title)}</h2><p class="section-lead">${escapeHtml(copy.work.lead)}</p></div><div class="work-grid">${work}</div><a class="text-link" href="https://4roaa.github.io/RoaaSultan3D/" target="_blank" rel="noreferrer"><span>${escapeHtml(copy.work.portfolio)}</span>${arrowIcon()}</a></section>

        <section class="process-section" id="about"><div class="section-heading centered"><p class="section-code">${escapeHtml(copy.process.code)}</p><h2>${escapeHtml(copy.process.title)}</h2></div><div class="process-rail">${steps}</div><div class="about-band"><div><h3>${escapeHtml(copy.process.aboutTitle)}</h3><p>${escapeHtml(copy.process.aboutBody)}</p></div><div class="value-list">${values}</div></div></section>

        <section class="packages-section" id="packages"><div class="section-heading centered"><p class="section-code">${escapeHtml(copy.packages.code)}</p><h2>${escapeHtml(copy.packages.title)}</h2><p class="section-lead">${escapeHtml(copy.packages.lead)}</p></div><div class="package-grid">${packages}</div><div class="package-notes"><p>${escapeHtml(copy.packages.custom)}</p><p>${escapeHtml(copy.packages.note)}</p></div></section>

        <section class="closing-section" id="contact">
          <div class="faq-panel"><p class="section-code">FAQ</p><h2>${escapeHtml(copy.faq.title)}</h2><div class="faq-list">${faq}</div></div>
          <div class="contact-panel"><h2>${escapeHtml(copy.contact.title)}</h2><p class="contact-subtitle">${escapeHtml(copy.contact.subtitle)}</p>
            <form id="quote-form">
              <div class="form-pair"><label><span>${escapeHtml(copy.contact.name)}</span><input name="name" type="text" autocomplete="name" required></label><label><span>${escapeHtml(copy.contact.company)}</span><input name="company" type="text" autocomplete="organization" required></label></div>
              <label><span>${escapeHtml(copy.contact.email)}</span><input name="email" type="email" autocomplete="email" required></label>
              <label><span>${escapeHtml(copy.contact.type)}</span><select name="projectType" required>${options}</select></label>
              <label><span>${escapeHtml(copy.contact.details)}</span><textarea name="details" rows="4" placeholder="${escapeHtml(copy.contact.detailsPlaceholder)}" required></textarea></label>
              <button class="contact-submit" type="submit">${escapeHtml(copy.contact.send)}</button><p class="form-note">${escapeHtml(copy.contact.sendingNote)}</p><p class="form-success" aria-live="polite"></p>
            </form>
            <div class="contact-details"><a href="mailto:roaa@roaa.agency">roaa@roaa.agency</a><span aria-hidden="true"></span><a href="https://roaa.agency">roaa.agency</a></div>
          </div>
        </section>

        <footer class="site-footer"><div><a class="footer-brand" href="#home">Roaa Agency <span>|</span> رؤى إيجنسي</a><p>${escapeHtml(copy.footer.statement)}</p></div><div class="footer-meta"><p>${escapeHtml(copy.footer.legal)}</p><p>© ${new Date().getFullYear()} — ${escapeHtml(copy.footer.rights)}</p></div></footer>
      </main>`;

    const navigationElement = root.querySelector(".main-nav");
    const menuButton = root.querySelector(".menu-toggle");
    const closeMenu = () => {
      navigationElement.classList.remove("is-open");
      menuButton.setAttribute("aria-expanded", "false");
      menuButton.setAttribute("aria-label", copy.menuLabel);
      menuButton.innerHTML = menuIcon(false);
    };

    menuButton.addEventListener("click", () => {
      const open = !navigationElement.classList.contains("is-open");
      navigationElement.classList.toggle("is-open", open);
      menuButton.setAttribute("aria-expanded", String(open));
      menuButton.setAttribute("aria-label", open ? copy.closeLabel : copy.menuLabel);
      menuButton.innerHTML = menuIcon(open);
    });
    navigationElement.querySelectorAll("a").forEach((link) => link.addEventListener("click", closeMenu));
    root.querySelector(".language-toggle").addEventListener("click", () => {
      language = language === "ar" ? "en" : "ar";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    root.querySelectorAll("[data-package]").forEach((link) => link.addEventListener("click", () => {
      selectedPackage = link.dataset.package;
      root.querySelector('select[name="projectType"]').value = selectedPackage;
    }));
    root.querySelector('select[name="projectType"]').addEventListener("change", (event) => {
      selectedPackage = event.target.value;
    });
    root.querySelector("#quote-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const name = String(form.get("name") || "");
      const company = String(form.get("company") || "");
      const email = String(form.get("email") || "");
      const projectType = String(form.get("projectType") || "");
      const details = String(form.get("details") || "");
      const subject = isArabic ? `طلب عرض سعر جديد — ${company}` : `New quote request — ${company}`;
      const body = isArabic
        ? `مرحبًا رؤى إيجنسي،\n\nالاسم: ${name}\nالمنشأة: ${company}\nالبريد: ${email}\nنوع المشروع: ${projectType}\n\nتفاصيل الاحتياج:\n${details}`
        : `Hello Roaa Agency,\n\nName: ${name}\nCompany: ${company}\nEmail: ${email}\nProject type: ${projectType}\n\nProject details:\n${details}`;
      root.querySelector(".form-success").textContent = copy.contact.sent;
      window.location.href = `mailto:roaa@roaa.agency?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    });
  }

  render();
})();
    </script>
  </body>
</html>
